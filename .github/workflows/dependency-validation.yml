name: Dependency validation

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_INDEX_URL: https://packagefeedproxy.microsoft.io/pypi/simple/

jobs:
  validate:
    name: Dependency validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            services/governance-api/requirements.txt
            services/mock-telemetry/requirements.txt
      - name: Install API and test dependencies
        run: |
          python -m pip install -r services/governance-api/requirements.txt -e "./services/governance-api[dev]"
          python -m pip check
      - name: Run API and dependency configuration tests
        run: python -m pytest services/governance-api/tests -q
      - name: Audit pinned runtime dependencies
        run: |
          python -m venv "$RUNNER_TEMP/dependency-audit"
          "$RUNNER_TEMP/dependency-audit/bin/pip" install pip-audit
          "$RUNNER_TEMP/dependency-audit/bin/pip-audit" \
            --strict --disable-pip --no-deps --vulnerability-service osv \
            -r services/governance-api/requirements.txt \
            -r services/mock-telemetry/requirements.txt
      - name: Build runtime images
        run: docker compose build
      - name: Check packaged API runtime
        run: |
          docker compose run --rm --no-deps --entrypoint python governance-api -c '
          import importlib.util
          from fastapi.testclient import TestClient
          from governance_api.main import app
          response = TestClient(app).get("/health")
          assert response.status_code == 200
          assert response.json()["status"] == "ok"
          assert importlib.util.find_spec("pip") is None
          assert importlib.util.find_spec("ensurepip") is None
          '
      - name: Validate Collector configuration
        env:
          APPLICATIONINSIGHTS_CONNECTION_STRING: InstrumentationKey=00000000-0000-0000-0000-000000000000
        run: docker compose run --rm --no-deps otel-collector validate --config /etc/otelcol-contrib/config.yaml
      - name: Install image vulnerability scanner
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.2
      - name: Audit all runtime images
        run: |
          docker compose config --images | sort -u > "$RUNNER_TEMP/runtime-images.txt"
          test "$(wc -l < "$RUNNER_TEMP/runtime-images.txt")" -eq 3
          while IFS= read -r image; do
            trivy image --scanners vuln --exit-code 1 "$image"
          done < "$RUNNER_TEMP/runtime-images.txt"
